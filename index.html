
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Aventura Chile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Viajes Aventura</h1>
    <nav>
      <button id="btn-login" onclick="abrirModal('modal-login')">Iniciar Sesión</button>
      <button id="btn-registro" onclick="abrirModal('modal-registro')">Registrarse</button>
      <button id="btn-logout" class="hidden" onclick="cerrarSesion()">Cerrar Sesión</button>
    </nav>
  </header>

  <main>
    <!-- Catálogo de destinos -->
    <section>
      <h2>Destinos</h2>
      <div id="indicador-dolar"></div>
      <div id="grid-destinos" class="grid"></div>
    </section>

    <!-- Catálogo de paquetes -->
    <section>
      <h2>Paquetes</h2>
      <div id="grid-paquetes" class="grid"></div>
    </section>

    <!-- Panel Cliente -->
    <section id="cliente-panel" class="hidden seccion">
      <h2>Panel Cliente</h2>
      <form id="form-reserva" onsubmit="procesarReserva(event)">
        <div class="form-group">
          <label for="select-paquete">Seleccione Paquete:</label>
          <select id="select-paquete" required></select>
        </div>
        <div class="form-group">
          <label for="cant-pasajeros">Cantidad de Pasajeros:</label>
          <input type="number" id="cant-pasajeros" value="1" min="1" required>
        </div>
        <p>Precio Unitario: <span id="resumen-precio-unitario">$0 CLP</span></p>
        <p>Total: <span id="resumen-total">$0 CLP</span></p>
        <button type="submit" class="btn-primary">Confirmar Reserva</button>
      </form>
    </section>

    <!-- Panel Administrador -->
    <section id="admin-panel" class="hidden seccion">
      <h2>Panel Administrador</h2>
      <div class="form-card">
        <form id="form-nuevo-paquete" onsubmit="crearNuevoPaquete(event)">
          <div class="form-group">
            <label for="admin-paquete-nombre">Nombre del Paquete:</label>
            <input type="text" id="admin-paquete-nombre" required>
          </div>
          <div class="form-group">
            <label for="admin-paquete-fecha">Fecha de Salida:</label>
            <input type="date" id="admin-paquete-fecha" required>
          </div>
          <div class="form-group">
            <label for="admin-paquete-precio">Precio (CLP):</label>
            <input type="number" id="admin-paquete-precio" required>
          </div>
          <div class="form-group">
            <label for="admin-paquete-cupo">Cupo:</label>
            <input type="number" id="admin-paquete-cupo" required>
          </div>
          <button type="submit" class="btn-primary">Crear Paquete</button>
        </form>
      </div>

      <!-- Tabla de paquetes administrados -->
      <h3>Gestión de Paquetes</h3>
      <div id="tabla-paquetes-admin">
        <table class="tabla-custom">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Fecha</th>
              <th>Precio</th>
              <th>Cupo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-paquetes-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Tabla de reservas (compartida) -->
    <section>
      <h2>Reservas</h2>
      <table class="tabla-custom">
        <thead>
          <tr>
            <th>ID</th>
            <th>Paquete</th>
            <th>Pasajeros</th>
            <th>Total</th>
            <th>Estado</th>
            <th id="th-acciones" class="hidden">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-reservas-body"></tbody>
      </table>
    </section>
  </main>

  <!-- Modales -->
  <div id="modal-login" class="modal hidden">
    <form onsubmit="iniciarSesion(event)">
      <h3>Iniciar Sesión</h3>
      <input type="email" id="login-email" placeholder="Correo electrónico" required>
      <button type="submit">Entrar</button>
      <button type="button" onclick="cerrarModal('modal-login')">Cancelar</button>
    </form>
  </div>

  <div id="modal-registro" class="modal hidden">
    <form onsubmit="registrarCliente(event)">
      <h3>Registro</h3>
      <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
      <input type="email" id="reg-email" placeholder="Correo electrónico" required>
      <input type="text" id="reg-rut" placeholder="RUT" required>
      <button type="submit">Registrar</button>
      <button type="button" onclick="cerrarModal('modal-registro')">Cancelar</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
